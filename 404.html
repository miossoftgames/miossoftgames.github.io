<!doctype html>
<html lang="en">
  <head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#060806" />
    <link rel="icon" type="image/svg+xml" href="MiosLogo-min.jpg" />
    <title>404 — Signal Lost | Miossoft Games</title>
    <style>
      :root {
        --bg: #060806;
        --border: #172b19;
        --bright: #245027;
        --neon: #10db05;
        --text: #e8f4e8;
        --muted: #718772;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 45%, rgba(16, 219, 5, 0.08), transparent 34%),
          var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.48;
        background: repeating-linear-gradient(
          to bottom,
          rgba(16, 219, 5, 0.018) 0,
          rgba(16, 219, 5, 0.018) 1px,
          transparent 1px,
          transparent 4px
        );
      }
      main {
        width: min(720px, calc(100% - 36px));
        padding: 48px;
        position: relative;
        border: 1px solid var(--bright);
        background: rgba(9, 13, 10, 0.78);
        text-align: center;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
      }
      .code {
        margin: 0;
        color: var(--neon);
        font: 700 10px monospace;
        letter-spacing: 0.18em;
      }
      h1 {
        margin: 18px 0 0;
        color: var(--neon);
        font-family: Impact, "Arial Narrow", sans-serif;
        font-size: clamp(110px, 25vw, 210px);
        font-weight: 900;
        letter-spacing: -0.04em;
        line-height: 0.82;
        text-shadow:
          0 0 12px rgba(16, 219, 5, 0.5),
          0 0 50px rgba(16, 219, 5, 0.15);
      }
      h2 {
        margin: 24px 0 0;
        font: 900 clamp(24px, 6vw, 42px) Impact, "Arial Narrow", sans-serif;
        letter-spacing: 0.03em;
      }
      p {
        max-width: 470px;
        margin: 18px auto 30px;
        color: var(--muted);
        line-height: 1.7;
      }
      a {
        min-width: 190px;
        padding: 15px 18px;
        display: inline-flex;
        justify-content: space-between;
        gap: 24px;
        border: 1px solid var(--neon);
        background: var(--neon);
        color: #061009;
        font: 700 10px monospace;
        letter-spacing: 0.1em;
        text-decoration: none;
        transition: 0.2s;
      }
      a:hover {
        box-shadow: 0 0 26px rgba(16, 219, 5, 0.22);
        transform: translateY(-3px);
      }
      a:focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 4px;
      }
      .corner {
        position: absolute;
        width: 18px;
        height: 18px;
        border-color: var(--neon);
      }
      .tl {
        top: -1px;
        left: -1px;
        border-top: 2px solid;
        border-left: 2px solid;
      }
      .br {
        right: -1px;
        bottom: -1px;
        border-right: 2px solid;
        border-bottom: 2px solid;
      }
      @media (max-width: 600px) {
        main {
          padding: 40px 22px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <i class="corner tl"></i><i class="corner br"></i>
      <p class="code">ERROR_404 / SIGNAL_LOST</p>
      <h1>404</h1>
      <h2>PAGE NOT FOUND.</h2>
      <p>
        The page you are looking for may have moved, been removed, or never
        existed.
      </p>
      <a href="/">RETURN HOME <b>↗</b></a>
    </main>
  </body>
</html>
